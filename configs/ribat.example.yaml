version: 1

default_policy:
  mutable_tags:
    action: quarantine
    min_digest_age: 7d
    allow_first_seen_pull: false

  digest_pinned_images:
    action: allow

  failed_registry_resolution:
    action: deny

  failed_signature_check:
    action: deny

rules:
  - match: "*:latest"
    mutable_tags:
      min_digest_age: 14d
      allow_first_seen_pull: false

  - match: "*:stable"
    mutable_tags:
      min_digest_age: 7d
      allow_first_seen_pull: false

  - match: "*:main"
    mutable_tags:
      min_digest_age: 7d
      allow_first_seen_pull: false

  - match: "*:v*"
    mutable_tags:
      min_digest_age: 3d
      allow_first_seen_pull: false

audit:
  path: "/var/log/ribat/audit.jsonl"

state:
  backend: sqlite
  path: "/var/lib/ribat/state.db"
